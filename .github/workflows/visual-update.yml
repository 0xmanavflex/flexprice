name: Visual baselines

# Regenerates the screenshot baselines on the same runner as `visual.yml`.
#
# Text renders slightly differently on a laptop or a dev container than on the
# Actions runner, enough to push a text-heavy page past the 1% tolerance, so
# baselines made locally fail in CI. Add the `update-visual-baselines` label to
# a PR: this job regenerates the baselines, checks them with a second run,
# commits them to the PR branch and removes the label. The image diff is then
# reviewed in the PR (`apps/console/e2e/visual/README.md`).
#
# A push made with GITHUB_TOKEN starts no workflow, so the commit this job makes
# has no Screenshots run of its own. Push to the PR again (a merge of the base
# branch is enough) to run Screenshots against the new baselines.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  update:
    name: Update baselines
    if: >-
      github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Pinned, not ubuntu-latest: that label is moving to Ubuntu 26, and a
    # baseline made on one image fails on the other.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: visual-update-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install the Playwright browser
        run: pnpm --filter console exec playwright install --with-deps chromium

      - name: Regenerate the baselines
        run: pnpm test:visual:update

      - name: Check them with a second run
        run: pnpm test:visual

      - name: Commit them to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/console/e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo 'Baselines already match this runner.'
          else
            git commit -m 'test(visual): regenerate baselines on the CI runner'
            git push
          fi

      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label update-visual-baselines
