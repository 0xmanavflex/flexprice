name: Storybook deploy develop

# Publishes the `develop` branch's Storybook to its own Vercel project, apart
# from the production Storybook that storybook-deploy.yml publishes from `main`.
# The two have independent URLs, protection and history.
#
# Skips with a warning until the secret exists, like the other deploys.
#
#   VERCEL_TOKEN                          shared with the other deploys
#   VERCEL_ORG_ID                         shared with the other deploys
#   VERCEL_STORYBOOK_DEVELOP_PROJECT_ID   Vercel → the develop *Storybook* project → Settings → General
#
# The project is an empty Vercel project (framework "Other"); the workflow builds
# Storybook itself and uploads the static site, so its settings are never read.
# No application variables are needed: Storybook runs on fixtures.
on:
  push:
    branches:
      - develop
    paths:
      - 'packages/ui/**'
      - 'packages/domain/**'
      - 'scripts/storybook-anatomy.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook-deploy-develop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel (Storybook develop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STORYBOOK_DEVELOP_PROJECT_ID }}
    steps:
      - name: Decide whether this can deploy
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            reason="the VERCEL_TOKEN repository secret is not set"
          elif [ -z "$VERCEL_ORG_ID" ]; then
            reason="the VERCEL_ORG_ID repository secret is not set"
          elif [ -z "$VERCEL_PROJECT_ID" ]; then
            reason="the VERCEL_STORYBOOK_DEVELOP_PROJECT_ID repository secret is not set"
          else
            reason=""
          fi

          if [ -n "$reason" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Storybook deploy skipped — $reason. The secrets are listed at the top of .github/workflows/storybook-deploy-develop.yml."
            echo "Storybook deploy skipped — $reason." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "environment=production" >> "$GITHUB_OUTPUT"
          echo "flag=--prod" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.enabled == 'true'
        env:
          HUSKY: 0

      # The Anatomy panel and Page map read a generated file; building from a
      # stale one would publish a workbench that lies about what a page uses.
      - name: Check the component map is current
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/storybook-anatomy.mjs --check

      - name: Build Storybook
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm --filter @fp/ui build-storybook

      # Vercel's Build Output API: a `.vercel/output` folder is deployed as-is,
      # with no remote build and no dependence on the project's own settings.
      - name: Package the static site
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p .vercel/output/static
          cp -R packages/ui/dist/storybook/. .vercel/output/static/
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/(.*)",
                "headers": { "x-robots-tag": "noindex, nofollow" },
                "continue": true
              },
              {
                "src": "/assets/(.*)",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              { "handle": "filesystem" }
            ]
          }
          JSON

      # Pinned to a major so a CLI release cannot change the deploy underneath
      # us. Bump deliberately.
      - name: Install the Vercel CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --global vercel@59

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.gate.outputs.flag }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Storybook deployed to ${{ steps.gate.outputs.environment }} — $url" >> "$GITHUB_STEP_SUMMARY"
