name: Deploy hosted invoice

# Deploys `main`'s hosted invoice page (`apps/hosted-invoice`) to its own Vercel
# project, served on invoice.flexprice.io for every region.
#
# One deployment serves all regions: the link's first path segment picks the
# API (`/us/<token>`, `/in/<token>`, `/ca/<token>`, `/staging/<token>`) from
# `VITE_HOSTED_INVOICE_API_URLS`, a JSON map of region → API origin set in the
# project's own Environment Variables, which `vercel pull` fetches at build time.
#
# One-time setup:
#   1. Create the Vercel project with Root Directory `apps/hosted-invoice`.
#   2. Set `VITE_HOSTED_INVOICE_API_URLS` for production, e.g.
#      {"us":"https://us.api.flexprice.io","in":"https://api.cloud.flexprice.io",
#       "ca":"https://<canada api>","staging":"https://staging.api.flexprice.io"}
#   3. Add the domain invoice.flexprice.io, and a Cloudflare CNAME to Vercel.
#
# Secrets (Settings → Secrets and variables → Actions):
#
#   VERCEL_TOKEN                       shared with deploy.yml
#   VERCEL_ORG_ID                      shared with deploy.yml
#   VERCEL_HOSTED_INVOICE_PROJECT_ID   Vercel → the hosted invoice project → Settings → General
#
# Gated like deploy-regions.yml: a missing secret skips with a warning rather
# than failing. A push to `main` is the production deployment.
on:
  # Called by `pipeline.yml` after the gate passes. Run it by hand from the
  # Actions tab to redeploy a single commit.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel (hosted invoice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push replaces a deploy still running.
    concurrency:
      group: deploy-hosted-invoice
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_HOSTED_INVOICE_PROJECT_ID }}
    steps:
      - name: Decide whether the hosted invoice page can deploy
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            reason="the VERCEL_TOKEN repository secret is not set"
          elif [ -z "$VERCEL_ORG_ID" ]; then
            reason="the VERCEL_ORG_ID repository secret is not set"
          elif [ -z "$VERCEL_PROJECT_ID" ]; then
            reason="the VERCEL_HOSTED_INVOICE_PROJECT_ID repository secret is not set"
          else
            reason=""
          fi

          if [ -n "$reason" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hosted invoice deploy skipped — $reason. The secrets are listed at the top of .github/workflows/deploy-hosted-invoice.yml."
            echo "Hosted invoice deploy skipped — $reason." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.enabled == 'true'
        env:
          HUSKY: 0

      # Pinned to a major so a CLI release cannot change the build underneath
      # us. Bump deliberately.
      - name: Install the Vercel CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --global vercel@59

      - name: Pull the Vercel environment
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "Deployed the hosted invoice page to production — $url" >> "$GITHUB_STEP_SUMMARY"
