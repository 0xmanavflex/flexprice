name: SDK watch

# Keeps the console honest about @flexprice/sdk, the one contract it has with
# the backend. Weekly, because the SDK and the backend release on their own
# schedule and nothing in this repo changes when they do.
#
# It fails, and opens one issue (or comments on the open one), when:
#   - a newer @flexprice/sdk is published than the one installed;
#   - the backend spec has operations or fields the installed SDK lacks, beyond
#     the known gaps in scripts/sdk-baseline.json;
#   - the console calls something the SDK does not have, or `as never` casts on
#     SDK calls have gone up.
# Dependabot opens the upgrade PR; this is the part that explains what moved.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: SDK and backend spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Compare the SDK, the console and the backend spec
        id: check
        run: |
          set +e
          node scripts/check-sdk.mjs --remote --check | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: steps.check.outputs.status != '0'
        run: |
          title='@flexprice/sdk is out of step'
          body="$(printf 'The weekly SDK watch found drift. Run `node scripts/check-sdk.mjs --remote` for the live report.\n\nTo accept known gaps after reviewing them: `node scripts/check-sdk.mjs --write-baseline`.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s' "$(cat report.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          number="$(gh issue list --label sdk-update --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create sdk-update --description 'SDK or backend contract drift' --color 0E8A16 2>/dev/null || true
            gh issue create --title "$title" --label sdk-update --body "$body"
          fi

      - name: Fail the run so it shows red
        if: steps.check.outputs.status != '0'
        run: exit 1
