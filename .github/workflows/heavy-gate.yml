name: Heavy suite gate

# Decides whether one of the slow mocked suites (E2E, Storybook, Visual) is
# worth running for this event. Called by those workflows; it does nothing on
# its own.
#
#   pull request, draft            → skip (runs again on "Ready for review")
#   pull request, docs only        → skip (`docs/**` and Markdown files)
#   nightly, develop unchanged     → skip (develop not pushed to in 25 hours)
#   anything else                  → run
#
# Why a job and not `paths-ignore`: the suites are required checks. A workflow
# filtered out by `paths-ignore` never reports, and the pull request waits for
# it forever. A job skipped by `if:` reports "skipped", which branch protection
# accepts. The gate reads the API rather than checking out the repository, so
# it costs seconds.
on:
  workflow_call:
    outputs:
      run:
        description: "'true' when the suite should run"
        value: ${{ jobs.decide.outputs.run }}

permissions:
  contents: read
  pull-requests: read

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const skip = async (reason) => {
              core.setOutput('run', 'false')
              core.notice(`Skipped: ${reason}`)
              await core.summary.addRaw(`Skipped: ${reason}\n`).write()
            }

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request
              if (pr.draft) return skip('draft pull request. It runs once marked ready for review.')
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              })
              const isDocs = (name) => name.startsWith('docs/') || name.endsWith('.md')
              // A rename counts as documentation only when both ends of it are:
              // moving `src/x.ts` to `docs/x.md` removes code.
              const docsOnly =
                files.length > 0 &&
                files.every(
                  (f) =>
                    isDocs(f.filename) && (!f.previous_filename || isDocs(f.previous_filename)),
                )
              if (docsOnly) return skip('only documentation changed.')
            }

            if (context.eventName === 'schedule') {
              // When develop last moved, not when its newest commit was made: a
              // fast-forward can bring in commits dated days earlier. The
              // repository activity feed records the push itself. If it cannot
              // be read, run rather than skip on a guess.
              const cutoff = Date.now() - 25 * 60 * 60 * 1000
              let lastPush = null
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/activity', {
                  ...context.repo,
                  ref: 'refs/heads/develop',
                  per_page: 1,
                })
                lastPush = data[0]?.timestamp ? Date.parse(data[0].timestamp) : null
              } catch (error) {
                core.warning(`Could not read when develop last changed (${error.message}); running.`)
              }
              if (lastPush !== null && lastPush < cutoff) {
                return skip('develop has not changed in the last 25 hours.')
              }
            }

            core.setOutput('run', 'true')
