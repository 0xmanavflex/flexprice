name: Pipeline

# What a push to `main` does, in order.
#
#   1. Check    lint, unit tests, production bundle        (in parallel)
#   2. Deploy   the main project and the regions           (in parallel)
#
# Every workflow here also runs on its own for pull requests — see each file's
# own `on:`. What this adds is **order on main**: a region deploys only a
# commit whose checks passed, never one whose unit tests are still running.
#
# ## 1. Check — what holds up a release
#
# Only the fast things that can call a commit wrong: lint and types, the unit
# suite, and whether it builds at all. Two to three minutes, and a region
# deploys only if all three pass.
#
# ## 2. Deploy — every region at once
#
# `deploy` is the main project, `deploy-regions` the India/Canada matrix. They
# are separate workflows because they have separate Vercel projects and
# separate secrets, not because they need separate timing. A region failing
# does not stop the others; that is `fail-fast: false` inside the matrix.
#
# ## No mocked suites after the deploy
#
# Storybook, E2E and the visual screenshots used to run here a third time,
# after the regions were live. They build the app with `VITE_USE_MOCKS=true`,
# so they describe neither the deployment nor anything the pull request into
# `main` had not already tested, and they could not stop a release they ran
# after. They run on pull requests and nightly on `develop` instead. The live
# release is checked by `e2e-release.yml`, against production.
on:
  push:
    branches:
      - main

# A newer push to main replaces one still working its way through.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `deploy` comments the preview URL on a pull request.
  pull-requests: write

jobs:
  # ── 1. Check ──────────────────────────────────────────────────────────────
  check-lint:
    name: Check lint
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  check-unit:
    name: Check unit tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  check-build:
    name: Check build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # ── 2. Deploy ─────────────────────────────────────────────────────────────
  deploy-main:
    name: Deploy main
    needs: [check-lint, check-unit, check-build]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  deploy-regions:
    name: Deploy regions
    needs: [check-lint, check-unit, check-build]
    uses: ./.github/workflows/deploy-regions.yml
    secrets: inherit
