name: Pipeline

# What a push to `main` does, in order.
#
#   gate ──▶ deploy (all regions, in parallel) ──▶ storybook + e2e
#
# Every workflow here also runs on its own for pull requests and the other
# branches — see each file's own `on:`. What this adds is **order on main**,
# which the previous arrangement had none of: all nine workflows started at
# once, so a region could finish deploying a commit whose unit tests were
# still running, and sometimes failing.
#
# ## The gate
#
# Lint, unit tests, build and the visual snapshots. Everything that can say
# "this commit is wrong" without touching a deployment. All four run in
# parallel; a region deploys only if all four pass.
#
# ## The deploys
#
# `deploy` is the main project and `deploy-regions` is the India/Canada matrix,
# started together. They are separate workflows because they have separate
# Vercel projects and separate secrets, not because they need separate timing.
# A region failing does not stop the others — that is `fail-fast: false` inside
# the matrix.
#
# ## After the deploy
#
# Storybook and E2E. Both build the app with `VITE_USE_MOCKS=true`, so neither
# touches a deployment and neither can be broken *by* one; they are here rather
# than in the gate so that shipping is not held up for ~10 minutes by suites
# that do not describe the thing being shipped.
#
# The consequence is worth being plain about: an E2E failure arrives after the
# regions are already live. Nothing downstream is blocked by it — these are the
# last jobs in the graph — but the run goes red, which is the point. If that
# ever becomes a release you would have wanted to stop, move them into the gate
# and accept the wait; the two `needs:` lines below are the whole change.
on:
  push:
    branches:
      - main

# A newer push to main replaces one still working its way through.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `deploy` comments the preview URL on a pull request.
  pull-requests: write

jobs:
  lint:
    name: Gate
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  unit:
    name: Gate
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    name: Gate
    uses: ./.github/workflows/build.yml
    secrets: inherit

  visual:
    name: Gate
    uses: ./.github/workflows/visual.yml
    secrets: inherit

  deploy:
    needs: [lint, unit, build, visual]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  regions:
    needs: [lint, unit, build, visual]
    uses: ./.github/workflows/deploy-regions.yml
    secrets: inherit

  # Reported, not gating: nothing depends on these, and the deploy they follow
  # has already happened. `continue-on-error` is not available on a job that
  # calls a reusable workflow, so a failure here marks the run red rather than
  # being swallowed — which is the honest outcome for a test that failed.
  storybook:
    needs: [deploy, regions]
    uses: ./.github/workflows/storybook.yml
    secrets: inherit

  e2e:
    needs: [deploy, regions]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
