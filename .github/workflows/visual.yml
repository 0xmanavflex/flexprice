name: Visual

# Screenshot regression: one viewport capture per route against a mock-backed
# console, compared with the baselines in `apps/console/e2e/visual/__screenshots__`.
#
# Baselines are generated on Linux chromium, which is what `ubuntu-latest` runs,
# so a diff here is a real pixel change and not an OS font difference. To accept
# one, update the baselines in the PR and say why (`e2e/visual/README.md`).
#
# The Playwright config starts the app itself (`VITE_USE_MOCKS=true`).
#
# Text renders slightly differently on a laptop or a dev container than on this
# runner, enough to fail a text-heavy page. So baselines are made here: add the
# `update-visual-baselines` label to a PR and the `Update baselines` job
# regenerates them on this runner, commits them to the PR branch and removes
# the label. Review the image diff in the PR before merging.
on:
  # Called by `pipeline.yml` on a push to main, so main runs these in order
  # rather than all at once. The triggers below still fire on their own for
  # every other branch and every pull request.
  workflow_call:
  push:
    branches:
      - develop
      - feat/v2-foundation
      - 'ci/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshots
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install the Playwright browser
        run: pnpm --filter console exec playwright install --with-deps chromium

      - name: Compare every route with its baseline
        run: pnpm test:visual

      # `always() && failure()` so the report and the actual/expected/diff
      # images survive the failure they document.
      - name: Keep the diff images and report
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ github.run_id }}
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 7

  update-baselines:
    name: Update baselines
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: visual-update-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install the Playwright browser
        run: pnpm --filter console exec playwright install --with-deps chromium

      - name: Regenerate the baselines
        run: pnpm test:visual:update

      # A push made with GITHUB_TOKEN starts no workflow, so the next push to
      # the PR is what runs Screenshots against these.
      - name: Commit them to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/console/e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo 'Baselines already match this runner.'
          else
            git commit -m 'test(visual): regenerate baselines on the CI runner'
            git push
          fi

      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label update-visual-baselines
