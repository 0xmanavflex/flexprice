name: Visual

# Screenshot regression: one viewport capture per route against a mock-backed
# console, compared with the baselines in `apps/console/e2e/visual/__screenshots__`.
#
# Baselines are generated on Linux chromium on the pinned `ubuntu-24.04` runner,
# so a diff here is a real pixel change and not an OS font difference. To accept
# one, update the baselines in the PR and say why (`e2e/visual/README.md`).
#
# The Playwright config starts the app itself (`VITE_USE_MOCKS=true`).
#
# Text renders slightly differently on a laptop or a dev container than on this
# runner, enough to fail a text-heavy page, so baselines are made on this runner:
# see `visual-update.yml`.
#
# Runs on pull requests and once a night against `develop`, not on every push
# to `develop`; `heavy-gate.yml` skips drafts, documentation-only changes and a
# night with no new commit. See `e2e.yml` for why.
on:
  workflow_call:
  push:
    branches:
      # A change to CI should prove itself on its own branch first.
      - 'ci/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 02:00 IST.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/heavy-gate.yml

  screenshots:
    name: Screenshots
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Pinned, not ubuntu-latest: that label is moving to Ubuntu 26, and a
    # baseline made on one image fails on the other.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
          # The nightly run tests develop; a schedule otherwise checks out the
          # default branch.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter console exec playwright --version | sed -n 's/^Version //p' | tail -1)" >> "$GITHUB_OUTPUT"

      # The browser download is the same for every run of one Playwright
      # version, so it is cached; the system libraries are installed each time.
      - name: Restore the Playwright browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install the Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter console exec playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter console exec playwright install-deps chromium

      - name: Compare every route with its baseline
        run: pnpm test:visual

      # `always() && failure()` so the report and the actual/expected/diff
      # images survive the failure they document.
      - name: Keep the diff images and report
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ github.run_id }}
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 7
