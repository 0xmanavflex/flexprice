name: E2E

# The Playwright journeys, against a mock-backed copy of the console.
#
# The Playwright config starts the app itself (`VITE_USE_MOCKS=true`) and waits
# for it, so there is no separate "start the server" step — the journeys own
# their server for as long as they run.
#
# This tests the application, not a deployment, and it posts nothing to Slack.
# The deployed frontend is tested by `e2e-release.yml`, which runs only after a
# successful production deploy from `main` and sends the one Slack report per
# release (docs/e2e-journeys.md).
on:
  # Called by `pipeline.yml` on a push to main, so main runs these in order
  # rather than all at once. The triggers below still fire on their own for
  # every other branch and every pull request.
  workflow_call:
  push:
    branches:
      - develop
      - feat/v2-foundation
      # A change to CI should prove itself on its own branch, before it reaches
      # one where a mistake blocks everyone.
      - 'ci/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install the Playwright browser
        run: pnpm --filter console exec playwright install --with-deps chromium

      - name: Run the journeys against the mocked console
        id: journeys
        run: pnpm --filter console test:e2e

      # One report per journey (`e2e/reporters/journey-reporter.ts`), kept
      # whatever happened — evidence inside it exists only for journeys that
      # failed.
      - name: Keep the journey reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/console/e2e-results
          if-no-files-found: warn
          retention-days: 14

      # `always() && failure()` so the trace, video and screenshots survive the
      # failure they document. Without it the upload is skipped exactly when it
      # is needed.
      - name: Keep the failure artifacts
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 7
