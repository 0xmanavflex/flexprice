name: E2E

# The Playwright journeys, against a mock-backed copy of the console.
#
# The Playwright config starts the app itself (`VITE_USE_MOCKS=true`) and waits
# for it, so there is no separate "start the server" step — the journeys own
# their server for as long as they run.
#
# This tests the application, not a deployment, and it posts nothing to Slack.
# The deployed frontend is tested by `e2e-release.yml`, which runs only after a
# successful production deploy from `main` and sends the one Slack report per
# release (docs/e2e-journeys.md).
#
# ## When it runs
#
# On pull requests, and once a night against `develop`. Not on every push to
# `develop`: that branch took ~50 pushes in a week, each a 15-minute run that
# the next push usually cancelled half way. The nightly run catches what lands
# on `develop` without a pull request. `heavy-gate.yml` skips drafts,
# documentation-only changes, and a night with no new commit.
on:
  workflow_call:
  push:
    branches:
      # A change to CI should prove itself on its own branch, before it reaches
      # one where a mistake blocks everyone.
      - 'ci/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 02:00 IST.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/heavy-gate.yml

  journeys:
    name: Journeys
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
          # The nightly run tests develop; a schedule otherwise checks out the
          # default branch.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # The browser download is the same for every run of one Playwright
      # version, so it is cached; the system libraries are installed each time.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter console exec playwright --version | sed -n 's/^Version //p' | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install the Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter console exec playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter console exec playwright install-deps chromium

      - name: Run the journeys against the mocked console
        id: journeys
        run: pnpm --filter console test:e2e

      # The failing journeys by name, in the run summary and as annotations on
      # the pull request, so a red check says what broke without downloading
      # an artifact.
      - name: Name the failing journeys
        if: always() && steps.journeys.outcome != 'skipped'
        run: node .github/scripts/e2e-summary.mjs apps/console/playwright-results.json

      # One report per journey (`e2e/reporters/journey-reporter.ts`), kept
      # whatever happened — evidence inside it exists only for journeys that
      # failed.
      - name: Keep the journey reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/console/e2e-results
          if-no-files-found: warn
          retention-days: 14

      # `always() && failure()` so the trace, video and screenshots survive the
      # failure they document. Without it the upload is skipped exactly when it
      # is needed.
      - name: Keep the failure artifacts
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 7
