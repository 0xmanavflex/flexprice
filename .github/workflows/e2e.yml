name: E2E

# The Playwright journeys, against a mock-backed copy of the console.
#
# The Playwright config starts the app itself (`VITE_USE_MOCKS=true`) and waits
# for it, so there is no separate "start the server" step — the journeys own
# their server for as long as they run.
#
# This tests the application, not a deployment. Once `deploy.yml` has its
# credentials and produces a preview URL, the stronger version of this layer is
# to point `E2E_BASE_URL` at that URL instead: a suite that boots its own copy
# of the bundle cannot catch a broken build output, a bad rewrite rule or a
# missing environment variable, which is the whole reason the layer exists.
# Watchtower's CI already works that way and is the model to follow.
on:
  # Called by `pipeline.yml` on a push to main, so main runs these in order
  # rather than all at once. The triggers below still fire on their own for
  # every other branch and every pull request.
  workflow_call:
  push:
    branches:
      - develop
      - feat/v2-foundation
      # A change to CI should prove itself on its own branch, before it reaches
      # one where a mistake blocks everyone.
      - 'ci/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install the Playwright browser
        run: pnpm --filter console exec playwright install --with-deps chromium

      - name: Run the journeys against the mocked console
        id: journeys
        run: pnpm --filter console test:e2e

      # "These journeys passed" or "this journey failed", with a link to the
      # run, posted to Slack after every push to main (where `pipeline.yml`
      # runs this after the deploys) and to develop. Built from Playwright's
      # JSON report by `.github/scripts/e2e-slack-summary.mjs`; tests tagged
      # `@journey` are listed by name.
      #
      # The webhook is a repository secret, never a value in this file:
      #   SLACK_E2E_WEBHOOK_URL  Slack → an app with Incoming Webhooks → the channel's URL
      # Without it the step logs a line and exits 0, so forks and repos without
      # Slack stay green. Pull requests skip it too: their result is on the PR.
      # A Slack outage only warns — it says nothing about the journeys.
      - name: Post the journey results to Slack
        if: ${{ !cancelled() }}
        env:
          SLACK_E2E_WEBHOOK_URL: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          E2E_OUTCOME: ${{ steps.journeys.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$SLACK_E2E_WEBHOOK_URL" ]; then
            echo "Slack summary skipped: the SLACK_E2E_WEBHOOK_URL secret is not set."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Slack summary skipped: pull request runs report on the pull request."
            exit 0
          fi

          case "$GITHUB_REF_NAME" in
            main) E2E_ENVIRONMENT="main, after the production deploy" ;;
            *) E2E_ENVIRONMENT="$GITHUB_REF_NAME" ;;
          esac
          export E2E_ENVIRONMENT

          payload=$(node .github/scripts/e2e-slack-summary.mjs apps/console/playwright-results.json)
          if ! curl --silent --show-error --fail-with-body --max-time 20 \
            -H 'Content-Type: application/json' --data "$payload" "$SLACK_E2E_WEBHOOK_URL"; then
            echo "::warning::Could not post the journey results to Slack."
          fi

      # `always() && failure()` so the trace, video and screenshots survive the
      # failure they document. Without it the upload is skipped exactly when it
      # is needed.
      - name: Keep the failure artifacts
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 7
