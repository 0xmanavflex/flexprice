name: Storybook

# Every story is a test. Vitest runs them in a real Chromium through Storybook's
# addon, and `.storybook/preview.ts` sets `a11y: { test: 'error' }`, so an axe
# violation fails the run rather than leaving a panel for someone to read.
#
# That makes this workflow the accessibility gate as well as the rendering one.
# It is the reason a contrast regression on a 12px delta is caught here and not
# in review.
#
# Runs on pull requests and once a night against `develop`, not on every push
# to `develop`; `heavy-gate.yml` skips drafts, documentation-only changes and a
# night with no new commit. See `e2e.yml` for why.
on:
  workflow_call:
  push:
    branches:
      # A change to CI should prove itself on its own branch first.
      - 'ci/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 02:00 IST.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/heavy-gate.yml

  stories:
    name: Stories (browser + a11y)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
          # The nightly run tests develop; a schedule otherwise checks out the
          # default branch.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # Separate from the run below on purpose: without the browser, Vitest
      # fails with "Executable doesn't exist", which reads like a broken test
      # and is a missing binary.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @fp/ui exec playwright --version | sed -n 's/^Version //p' | tail -1)" >> "$GITHUB_OUTPUT"

      # The browser download is the same for every run of one Playwright
      # version, so it is cached; the system libraries are installed each time.
      - name: Restore the Playwright browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install the browser the stories run in
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fp/ui exec playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @fp/ui exec playwright install-deps chromium

      - name: Run every story as a browser and accessibility test
        run: pnpm --filter @fp/ui test:stories

  build:
    name: Build the workbench
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
          # The nightly run tests develop; a schedule otherwise checks out the
          # default branch.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # The Anatomy panel and Page map read a generated file; this fails the
      # build when it has drifted from the source.
      - name: Check the component map is current
        run: node scripts/storybook-anatomy.mjs --check

      # A story can pass as a test and still break the static build — an
      # autodocs page that cannot resolve a type, a lazily imported language
      # for the code block. This catches that, and the artifact is a browsable
      # copy of the design system for the pull request.
      - name: Build Storybook
        run: pnpm --filter @fp/ui build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.run_id }}
          path: packages/ui/dist/storybook
          retention-days: 7
