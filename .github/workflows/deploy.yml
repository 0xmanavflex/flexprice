name: Deploy

# Vercel deployment, modelled on Watchtower's CI.
#
# **It does nothing until the secrets exist, and that is deliberate.** Every
# step below is gated on a single check that answers "can this deploy, and
# where". With no credentials the job *skips with a warning* rather than
# failing: a missing secret says nothing about the change under review, and a
# red check the author cannot act on is worse than no check.
#
# Secrets to add, all at Settings → Secrets and variables → Actions:
#
#   VERCEL_TOKEN        a token from Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID       Vercel → Team Settings → General ("Team ID")
#   VERCEL_PROJECT_ID   Vercel → the project → Settings → General
#
# Optional:
#
#   VERCEL_AUTOMATION_BYPASS_SECRET   Vercel → Project → Settings → Deployment
#                                     Protection. Only needed if previews are
#                                     protected and you later want the journeys
#                                     to run against them.
#
# Application config (every VITE_* variable) belongs in the Vercel project's
# own Environment Variables, not here — `vercel pull` fetches it at build time,
# so the bundle is built with exactly the configuration Vercel would use.
on:
  push:
    branches:
      - main
      - feat/v2-foundation
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # The gate. Resolved in a step rather than in `if:` expressions on each
      # later step, so there is one place that decides and one message when the
      # answer is no.
      - name: Decide whether this can deploy
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            reason="the VERCEL_TOKEN repository secret is not set"
          elif [ -z "$VERCEL_ORG_ID" ]; then
            reason="the VERCEL_ORG_ID repository secret is not set"
          elif [ -z "$VERCEL_PROJECT_ID" ]; then
            reason="the VERCEL_PROJECT_ID repository secret is not set"
          elif [ "$IS_FORK_PR" = "true" ]; then
            reason="pull requests from forks cannot read secrets"
          else
            reason=""
          fi

          if [ -n "$reason" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped — $reason. The secrets are listed at the top of .github/workflows/deploy.yml."
            echo "Deploy skipped — $reason." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          # A push to a tracked branch is that project's production; a pull
          # request is a preview.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.enabled == 'true'
        env:
          HUSKY: 0

      # Pinned to a major so a CLI release cannot change the build underneath
      # us. Bump deliberately.
      - name: Install the Vercel CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --global vercel@59

      - name: Pull the Vercel environment
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=${{ steps.gate.outputs.environment }}

      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build ${{ steps.gate.outputs.flag }}

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.gate.outputs.flag }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${{ steps.gate.outputs.environment }} — $url" >> "$GITHUB_STEP_SUMMARY"

      # Updated in place, so a busy pull request keeps one comment rather than
      # twenty.
      - name: Comment the preview URL
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}'
            const marker = '<!-- vercel-preview -->'
            const body = `${marker}\n**Preview deployed** — ${url}\n\nCommit \`${context.sha.slice(0, 7)}\`.`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
